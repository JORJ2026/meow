<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cat Quest">
<meta name="theme-color" content="#15122e">
<meta name="color-scheme" content="dark">
<meta name="description" content="Cat Quest: a cat platformer, endless runner and mini-games that play great on your phone.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="format-detection" content="telephone=no">
<title>Cat Quest</title>
<link rel="stylesheet" href="mobile.css">
</head>
<body data-o="l" data-deck="">
<noscript><p style="color:#fff;font:700 18px system-ui;padding:24px">Cat Quest needs JavaScript. Please turn it on and reload.</p></noscript>

<div id="app">
  <div id="stage">
    <canvas id="g" width="800" height="448" role="img" aria-label="Game screen"></canvas>

    <!-- in-game buttons -->
    <div id="top">
      <button id="mute" aria-label="Sound" title="Sound on/off">🔊</button>
      <button id="fs" aria-label="Fullscreen">⛶</button>
      <button id="mapb" aria-label="World map">🗺</button>
      <button id="home" aria-label="Pause and settings">☰</button>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>

  <!-- thumb deck: built by mobile.js -->
  <div id="deck" aria-hidden="true">
    <div id="mv" class="zone"></div>
    <div id="acts"></div>
  </div>
</div>

<!-- ===== HOME: pick a game ===== -->
<div id="store" role="dialog" aria-modal="true" aria-label="Choose a game" class="ov">
  <header class="ovhead"><h1>🐾 CAT QUEST</h1><p class="sub">Pick a game</p></header>
  <div id="sgrid"></div>
</div>

<!-- ===== PICK SHEET: choose your pet, then play ===== -->
<div id="menu" role="dialog" aria-modal="true" aria-label="Choose your pet" class="ov hide">
  <header class="ovhead sheethead">
    <button class="b back" id="pkback" aria-label="Back">‹</button>
    <h1 id="pkname">Cat Quest</h1>
  </header>
  <section class="sheetbody">
    <div class="petcol">
      <p class="mhead">Choose your pet</p>
      <div id="cards"></div>
      <div id="mdetail"></div>
    </div>
    <div class="playcol">
      <div id="pkworld"><p class="mhead">Choose your world</p><div id="lgroups" role="group" aria-label="World"></div></div>
      <button class="b big go" id="pkgo">▶ PLAY</button>
      <div class="sec2" id="pk2">
        <button class="b" id="pklevels">🗺 Levels &amp; worlds</button>
        <button class="b" id="pkintro">🎬 Watch intro</button>
      </div>
      <details class="codebox">
        <summary>🔑 Level code</summary>
        <div class="pwrow"><input id="pw" type="text" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="4" placeholder="000" enterkeyhint="go" aria-label="Level code"><button class="b" id="pwgo">Load</button></div>
      </details>
    </div>
  </section>

  <!-- legacy launch targets: clicked from code, never shown -->
  <div id="legacy" hidden>
<p id="runhint"></p><div id="lvls"></div>
    <button id="play"></button><button id="story"></button><button id="run"><canvas id="runicon" width="64" height="44"></canvas></button>
    <button id="temple"></button><button id="maze"></button><button id="pong"></button><button id="pac"></button><button id="tet"></button>
    <a id="jewels" href="jewels.html"></a><a id="run3d" href="runner3d.html"></a><a id="maze3d" href="maze3d.html"></a><a id="pong3d" href="pong3d.html"></a><a id="pac3d" href="pac3d.html"></a><a id="frog3d" href="frogger3d.html"></a>
    <button id="intro"></button><button id="wmbtn"></button><button id="mobbtn"></button>
  </div>
</div>

<!-- ===== PAUSE / SETTINGS ===== -->
<div id="pause" role="dialog" aria-modal="true" aria-label="Pause and settings" class="ov hide">
  <header class="ovhead"><h1>🐾 Paws</h1></header>
  <div id="ptabs"><button class="b" data-t="ph">📱 Touch</button><button class="b" data-t="pad">🎮 Pad</button><button class="b" data-t="kb">⌨️ Keys</button><button class="b gated" data-t="ed">🗺️ Editor</button></div>
  <div id="pbody"></div>
  <div class="prow2"><input class="codein" id="pcode" type="text" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="8" placeholder="🔑 Code" enterkeyhint="go" aria-label="Unlock code"><button class="b" id="pdesk" type="button" aria-pressed="false">🖥 Desktop mode: Off</button></div>
  <div class="actrow"><button class="b big go" id="presume">RESUME</button><button class="b" id="prestart">↻ Restart</button><button class="b" id="pmenu">☰ Menu</button></div>
</div>

<!-- ===== ENDLESS RUN SETUP ===== -->
<div id="runsetup" role="dialog" aria-modal="true" aria-label="Endless run setup" class="ov hide">
  <header class="ovhead"><h1>🏃 Endless Run</h1></header>
  <div id="rsbody"></div>
  <div class="actrow"><button class="b big go" id="rsgo">▶ GO!</button><button class="b" id="rsstages">🏁 50 Stages</button><button class="b" id="rsmap">🗺 Run map</button><button class="b" id="rsback">Back</button></div>
</div>

<!-- ===== MAP PICKER (temple / maze) ===== -->
<div id="gm" role="dialog" aria-modal="true" aria-label="Choose a map" class="ov hide">
  <header class="ovhead"><h1 id="gmt"></h1></header>
  <div id="gmtabs"></div>
  <canvas id="gmc" width="800" height="270"></canvas>
  <p class="sub" id="gmi"></p>
  <div class="actrow"><button class="b big go" id="gmgo">▶ GO!</button><button class="b" id="gmback">Back</button></div>
</div>

<!-- ===== WORLD / LEVEL MENU ===== -->
<div id="wm" role="dialog" aria-modal="true" aria-label="Worlds and levels" class="ov hide">
  <header class="ovhead"><h1>🌍 Worlds</h1></header>
  <div id="wmtabs"><button class="b" data-t="story">📖 Story</button><button class="b" data-t="free">🎮 Free play</button></div>
  <div id="wmbody"></div>
  <div class="actrow"><button class="b big" id="wmclose">Close</button></div>
</div>

<!-- ===== MESSAGE CARD ===== -->
<div id="msg" role="dialog" aria-modal="true" aria-label="Message" class="ov hide">
  <div class="card2">
    <h1 id="mt"></h1>
    <p class="sub" id="ms"></p>
    <div id="mb"></div>
  </div>
</div>

<div id="thumb"><canvas width="300" height="84"></canvas><div id="thumbn"></div></div>

<script>window.CQ_MUSIC_HOLD=1;window.CQ_MUSIC_NOBTN=1;window.CQ_MUSIC_BAR_POS='left';</script>
<script src="midi.js"></script>
<script src="game.js"></script>
<script src="store.js"></script>
<script src="mobile.js"></script>
<script src="portrait.js"></script>
<script src="desktop.js"></script>
<script src="improve.js"></script>
<script src="badges.js"></script>
<script src="release.js"></script>
<script src="polish2d.js"></script>
</body>
</html>
